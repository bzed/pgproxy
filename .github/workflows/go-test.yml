name: Go Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:

  test:
    name: Test on Go ${{ matrix.go_version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.25', '1.26']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run unit tests
      run: go test -v -short ./parser/... ./cli/...
      timeout-minutes: 5

    - name: Run proxy unit tests
      run: go test -v ./proxy/proxy_unit_test.go ./proxy/proxy.go ./proxy/formate.go

    - name: Check build
      run: go build -v ./...

  mock-test:
    name: Mock Tests (All Platforms)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.25', '1.26']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Install dependencies
      run: go mod download

    - name: Run mock server tests
      run: go test -v -run "TestMock|TestProxy|TestPgMock" ./proxy
      timeout-minutes: 5

  integration-test:
    name: Integration Tests (Linux only)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.25', '1.26']

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres -d testdb
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Install dependencies
      run: go mod download

    - name: Wait for PostgreSQL
      run: |
        for i in {1..10}; do
          if pg_isready -h localhost -p 5432 -U postgres -d testdb; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/10)"
          sleep 5
        done

    - name: Run integration tests with PostgreSQL
      run: go test -v ./proxy/... -run "Test_Start|Benchmark_Start" -timeout 30s
      timeout-minutes: 5

  coverage:
    name: Code Coverage (Linux only)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres -d testdb
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: go mod download

    - name: Wait for PostgreSQL
      run: |
        for i in {1..10}; do
          if pg_isready -h localhost -p 5432 -U postgres -d testdb; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/10)"
          sleep 5
        done

    - name: Run tests with coverage
      run: |
        # Run non-proxy tests (no PostgreSQL needed)
        go test -coverprofile=coverage_nonproxy.txt -covermode=atomic ./parser/... ./cli/... ./examples/...
        # Run proxy integration tests (PostgreSQL needed)
        go test -coverprofile=coverage_proxy.txt -covermode=atomic -run "Test_Start|Benchmark_Start|Test_getResolvedAddresses|Test_getListener" ./proxy
        # Merge coverage files
        if [ -f coverage_nonproxy.txt ]; then
          tail -n +2 coverage_nonproxy.txt >> coverage.txt
        fi
        if [ -f coverage_proxy.txt ]; then
          tail -n +2 coverage_proxy.txt >> coverage.txt
        fi
        # Add mode line
        echo "mode: atomic" > coverage_final.txt
        cat coverage.txt >> coverage_final.txt
        mv coverage_final.txt coverage.txt
      timeout-minutes: 5

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: coverage.txt
        flags: unittests
      continue-on-error: true

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run golangci-lint
      run: golangci-lint run --config .golangci.yml ./...

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Files need formatting: $unformatted"
          exit 1
        fi
