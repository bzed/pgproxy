name: Debian Packaging

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      # Pre-install git so actions/checkout works inside the slim container
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          # build-essential (gcc + libc6-dev) is required since parser/ uses
          # cgo (github.com/pganalyze/pg_query_go) - see AGENTS.md "Cgo
          # dependency". debian:stable-slim, unlike a real buildd chroot,
          # does not include it by default.
          apt-get install -y debhelper devscripts dpkg-dev golang-any build-essential

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgproxy-deb
          path: ./*.deb
