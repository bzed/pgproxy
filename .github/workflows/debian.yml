name: Debian Packaging

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      # Pre-install git so actions/checkout works inside the slim container
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          apt-get install -y debhelper devscripts dpkg-dev golang-any

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgproxy-deb
          path: ./*.deb
