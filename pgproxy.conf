# pgproxy configuration file

[ServerConfig]
    # The address and port pgproxy listens on for incoming connections
    # You can also listen on a unix socket: ProxyAddr = "/tmp/.s.PGSQL.5432"
    ProxyAddr = "127.0.0.1:9090"

# Target database configuration
# Multiple databases can be configured. The client's requested database name 
# in the StartupMessage will be used to route the connection to the correct backend.
[DB]
    [DB.master]
        Addr = "127.0.0.1:5432" # Target PostgreSQL database address
        User = "postgres"       # Target database username
        Password = "testpass"   # Target database password
        DBName = "testdb"       # Target database name
        
    [DB.reports]
        Addr = "10.0.0.5:5432"
        User = "reportuser"
        Password = "reportpassword"
        DBName = "reportsdb"

    [DB.local_socket]
        Addr = "/var/run/postgresql/.s.PGSQL.5432" # Connect to backend via Unix Socket
        User = "postgres"
        Password = "secretpassword"
        DBName = "postgres"

# SQL Firewall / Filtering rules
[Filter]
    allow_select = true
    allow_insert = true
    allow_update = true
    allow_delete = true
    
    # Destructive or sensitive statements
    allow_truncate = false
    allow_alter_role = false
    
    # Enforce safe mutations
    require_where_for_update = true
    require_where_for_delete = true

    # Signature-based filtering (pgBouncer style query fingerprinting)
    # block_signatures = ["SELECT * FROM users WHERE (id = _) AND (name = _)"]
    # allow_signatures = ["SELECT id FROM allowed_table"]