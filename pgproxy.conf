# pgproxy configuration file

[ServerConfig]
    # The address and port pgproxy listens on for incoming connections
    # You can also listen on a unix socket: ProxyAddr = "/tmp/.s.PGSQL.5432"
    ProxyAddr = "127.0.0.1:9090"

# Target database configuration
# Multiple databases can be configured. The client's requested database name 
# in the StartupMessage will be used to route the connection to the correct backend.
[DB]
    [DB.master]
        Addr = "127.0.0.1:5432" # Target PostgreSQL database address
                        DBName = "testdb"       # Target database name
        
    [DB.reports]
        Addr = "10.0.0.5:5432"
                DBName = "reportsdb"

    [DB.local_socket]
        Addr = "/var/run/postgresql/.s.PGSQL.5432" # Connect to backend via Unix Socket
                DBName = "postgres"

# SQL Firewall / Filtering rules
[Filter]
    allow_select = true
    allow_insert = true
    allow_update = true
    allow_delete = true

    # Destructive or sensitive statements
    allow_truncate = false
    allow_alter_role = false

    # SET/RESET is allowed by default so common driver/ORM init statements
    # (pgjdbc's "SET extra_float_digits = 3", ActiveRecord's
    # "SET client_min_messages", "SET TIME ZONE", ...) don't break every
    # connection out of the box. The GUCs listed in block_set_vars are
    # always blocked regardless of this setting, since setting them lets a
    # client change its own effective privileges mid-session.
    allow_set_var = true
    block_set_vars = ["session_authorization", "role"]

    # EXECUTE (of a previously PREPAREd statement) is blocked by default,
    # since the filter cannot see what the prepared statement actually
    # does at EXECUTE time.
    allow_execute = false

    # Enforce safe mutations
    require_where_for_update = true
    require_where_for_delete = true

    # What to do with a statement the parser cannot parse at all (see "SQL
    # Support" in README.md for known gaps - COPY, LISTEN, MERGE, DO, CALL,
    # cursors, and more). One of:
    #   "block" (default) - refuse the statement, like any other filter hit
    #   "allow"            - forward it unfiltered (SILENTLY BYPASSES the
    #                        firewall for anything the parser can't handle -
    #                        only use this if you understand and accept
    #                        that every filter rule above is a no-op for
    #                        such statements)
    #   "audit"            - same as "allow", but logs the (best-effort
    #                        secret-redacted) statement text first
    on_parse_error = "block"

    # Signature-based filtering (pgBouncer style query fingerprinting)
    signature_filter_enabled = false
    # If false, defaults to blocking anything not in allow_signatures
    signature_allow_by_default = false
    # If true, matches that would be blocked are instead logged in a copy-pastable format
    signature_audit_mode = false
    # block_signatures = ["SELECT * FROM users WHERE (id = _) AND (name = _)"]
    # allow_signatures = ["SELECT id FROM allowed_table"]